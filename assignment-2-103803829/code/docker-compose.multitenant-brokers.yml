services:
  zookeeper-tenant1:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper-tenant1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - cassandra_net
    ports:
      - "2182:2181"

  kafka-tenant1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-tenant1
    depends_on:
      - zookeeper-tenant1
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 101
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-tenant1:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-tenant1:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DELETE_TOPIC_ENABLE: "true"
    networks:
      - cassandra_net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  zookeeper-tenant2:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper-tenant2
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - cassandra_net
    ports:
      - "2183:2181"

  kafka-tenant2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-tenant2
    depends_on:
      - zookeeper-tenant2
    ports:
      - "9094:9092"
    environment:
      KAFKA_BROKER_ID: 102
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-tenant2:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-tenant2:29092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DELETE_TOPIC_ENABLE: "true"
    networks:
      - cassandra_net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  streamingestmanager:
    build:
      context: .
      dockerfile: dockerfile
    container_name: streamingestmanager
    command: ./streamingestmanager --command listen-alerts --alert-listen-addr :8082
    networks:
      - cassandra_net
    ports:
      - "8082:8082"

  streamingestmonitor:
    build:
      context: .
      dockerfile: dockerfile
    container_name: streamingestmonitor
    depends_on:
      - streamingestmanager
    command: ./streamingestmonitor
    environment:
      - MONITOR_LISTEN_ADDR=${MONITOR_LISTEN_ADDR:-:8081}
      - MANAGER_ALERT_URL=${MANAGER_ALERT_URL:-http://streamingestmanager:8082/alerts}
      - MONITOR_MIN_THROUGHPUT_RPS=${MONITOR_MIN_THROUGHPUT_RPS:-300}
      - MONITOR_MAX_AVG_BATCH_INGEST_MS=${MONITOR_MAX_AVG_BATCH_INGEST_MS:-250}
      - MONITOR_ALERT_COOLDOWN_SECONDS=${MONITOR_ALERT_COOLDOWN_SECONDS:-30}
    networks:
      - cassandra_net
    ports:
      - "8081:8081"

  tenant1-source:
    build:
      context: .
      dockerfile: dockerfile
    profiles:
      - workers
    depends_on:
      kafka-tenant1:
        condition: service_healthy
      cassandra1:
        condition: service_healthy
    networks:
      - cassandra_net
    volumes:
      - ../data:/data
      - ./tenant_configs:/app/tenant_configs:ro
    command: ./producer
    environment:
      - TENANT_ID=tenant1
      - KAFKA_BROKERS=kafka-tenant1:29092
      - KAFKA_TOPIC=bme280-measurements
      - SOURCE_NUM_CHUNKS=${SOURCE_NUM_CHUNKS:-1}
      - SOURCE_CHUNK_AUTO_ASSIGN=${SOURCE_CHUNK_AUTO_ASSIGN:-true}
      - CHUNK_NUM=${CHUNK_NUM:-}

  tenant2-source:
    build:
      context: .
      dockerfile: dockerfile
    profiles:
      - workers
    depends_on:
      kafka-tenant2:
        condition: service_healthy
      cassandra1:
        condition: service_healthy
    networks:
      - cassandra_net
    volumes:
      - ../data:/data
      - ./tenant_configs:/app/tenant_configs:ro
    command: ./producer
    environment:
      - TENANT_ID=tenant2
      - KAFKA_BROKERS=kafka-tenant2:29092
      - KAFKA_TOPIC=dht22-measurements
      - SOURCE_NUM_CHUNKS=${SOURCE_NUM_CHUNKS:-1}
      - SOURCE_CHUNK_AUTO_ASSIGN=${SOURCE_CHUNK_AUTO_ASSIGN:-true}
      - CHUNK_NUM=${CHUNK_NUM:-}

  tenant1-streamingestworker:
    build:
      context: .
      dockerfile: dockerfile
    profiles:
      - workers
    depends_on:
      kafka-tenant1:
        condition: service_healthy
      cassandra1:
        condition: service_healthy
      cassandra2:
        condition: service_healthy
      cassandra3:
        condition: service_healthy
      streamingestmonitor:
        condition: service_started
    networks:
      - cassandra_net
    volumes:
      - ./tenant_configs:/app/tenant_configs:ro
    command: ./consumer
    environment:
      - WORKER_MODE=managed
      - TENANT_ID=tenant1
      - KAFKA_BROKERS=kafka-tenant1:29092
      - KAFKA_TOPIC=bme280-measurements
      - KAFKA_CONSUMER_GROUP=tenant1-ingest-group
      - CASSANDRA_KEYSPACE=mysimbdp_tenant1
      - CASSANDRA_HOSTS=cassandra1,cassandra2,cassandra3
      - CASSANDRA_NUM_CONNS=${CASSANDRA_NUM_CONNS:-4}
      - CASSANDRA_INSERT_BATCH_SIZE=${CASSANDRA_INSERT_BATCH_SIZE:-25}
      - CASSANDRA_WRITE_SLEEP_MS=${CASSANDRA_WRITE_SLEEP_MS:-0}
      - MONITOR_REPORT_URL=${MONITOR_REPORT_URL:-http://streamingestmonitor:8081/reports}
      - MONITOR_REPORT_INTERVAL_SECONDS=${MONITOR_REPORT_INTERVAL_SECONDS:-15}

  tenant2-streamingestworker:
    build:
      context: .
      dockerfile: dockerfile
    profiles:
      - workers
    depends_on:
      kafka-tenant2:
        condition: service_healthy
      cassandra1:
        condition: service_healthy
      streamingestmonitor:
        condition: service_started
    networks:
      - cassandra_net
    volumes:
      - ./tenant_configs:/app/tenant_configs:ro
    command: ./consumer
    environment:
      - WORKER_MODE=managed
      - TENANT_ID=tenant2
      - KAFKA_BROKERS=kafka-tenant2:29092
      - KAFKA_TOPIC=dht22-measurements
      - KAFKA_CONSUMER_GROUP=tenant2-ingest-group
      - CASSANDRA_KEYSPACE=mysimbdp_tenant2
      - CASSANDRA_HOSTS=cassandra1,cassandra2,cassandra3
      - CASSANDRA_NUM_CONNS=${CASSANDRA_NUM_CONNS:-4}
      - CASSANDRA_INSERT_BATCH_SIZE=${CASSANDRA_INSERT_BATCH_SIZE:-25}
      - CASSANDRA_WRITE_SLEEP_MS=${CASSANDRA_WRITE_SLEEP_MS:-0}
      - MONITOR_REPORT_URL=${MONITOR_REPORT_URL:-http://streamingestmonitor:8081/reports}
      - MONITOR_REPORT_INTERVAL_SECONDS=${MONITOR_REPORT_INTERVAL_SECONDS:-15}

  tenant2-silverpipeline:
    build:
      context: .
      dockerfile: dockerfile
    profiles:
      - silver
    depends_on:
      cassandra1:
        condition: service_healthy
      cassandra2:
        condition: service_healthy
      cassandra3:
        condition: service_healthy
    networks:
      - cassandra_net
    volumes:
      - ./tenant_configs:/app/tenant_configs:ro
      - ./tenant_caching_dir:/app/tenant_caching_dir
      - ./logs:/app/logs
    command: ./silverpipeline
    environment:
      - TENANT_ID=tenant2
      - CASSANDRA_KEYSPACE=mysimbdp_tenant2
      - CASSANDRA_HOSTS=cassandra1,cassandra2,cassandra3
      - CASSANDRA_NUM_CONNS=${CASSANDRA_NUM_CONNS:-2}
      - SILVER_PIPELINE_CONFIG=./tenant_configs/silverpipeline_tenant2.yaml
      - SILVER_PIPELINE_STORAGE_BACKEND=${SILVER_PIPELINE_STORAGE_BACKEND:-local}
      - SILVER_PIPELINE_GCS_BUCKET=${SILVER_PIPELINE_GCS_BUCKET:-}
      - SILVER_PIPELINE_GCS_PREFIX=${SILVER_PIPELINE_GCS_PREFIX:-}
      - SILVER_PIPELINE_GCS_CREDENTIALS_FILE=${SILVER_PIPELINE_GCS_CREDENTIALS_FILE:-}
      - SILVER_PIPELINE_LOG_DIR=${SILVER_PIPELINE_LOG_DIR:-./logs/silverpipeline/tenant2}
      - SILVER_PIPELINE_RUN_LOG_FILE=${SILVER_PIPELINE_RUN_LOG_FILE:-run_status.jsonl}
      - SILVER_PIPELINE_TASK_LOG_FILE=${SILVER_PIPELINE_TASK_LOG_FILE:-task_status.jsonl}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}

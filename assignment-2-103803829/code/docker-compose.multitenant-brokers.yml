services:
  zookeeper-tenant1:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper-tenant1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - cassandra_net
    ports:
      - "2182:2181"

  kafka-tenant1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-tenant1
    depends_on:
      - zookeeper-tenant1
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 101
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-tenant1:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-tenant1:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DELETE_TOPIC_ENABLE: "true"
    networks:
      - cassandra_net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  zookeeper-tenant2:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper-tenant2
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - cassandra_net
    ports:
      - "2183:2181"

  kafka-tenant2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-tenant2
    depends_on:
      - zookeeper-tenant2
    ports:
      - "9094:9092"
    environment:
      KAFKA_BROKER_ID: 102
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-tenant2:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-tenant2:29092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DELETE_TOPIC_ENABLE: "true"
    networks:
      - cassandra_net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  tenant1-source:
    build:
      context: .
      dockerfile: dockerfile
    profiles:
      - workers
    depends_on:
      kafka-tenant1:
        condition: service_healthy
      cassandra1:
        condition: service_healthy
    networks:
      - cassandra_net
    volumes:
      - ../data:/data
      - ./tenant_configs:/app/tenant_configs:ro
    command: ./producer
    environment:
      - TENANT_ID=tenant1
      - KAFKA_BROKERS=kafka-tenant1:29092
      - KAFKA_TOPIC=bme280-measurements

  tenant2-source:
    build:
      context: .
      dockerfile: dockerfile
    profiles:
      - workers
    depends_on:
      kafka-tenant2:
        condition: service_healthy
      cassandra1:
        condition: service_healthy
    networks:
      - cassandra_net
    volumes:
      - ../data:/data
      - ./tenant_configs:/app/tenant_configs:ro
    command: ./producer
    environment:
      - TENANT_ID=tenant2
      - KAFKA_BROKERS=kafka-tenant2:29092
      - KAFKA_TOPIC=bme280-measurements

  tenant1-streamingestworker:
    build:
      context: .
      dockerfile: dockerfile
    profiles:
      - workers
    depends_on:
      kafka-tenant1:
        condition: service_healthy
      cassandra1:
        condition: service_healthy
    networks:
      - cassandra_net
    volumes:
      - ./tenant_configs:/app/tenant_configs:ro
    command: ./consumer
    environment:
      - WORKER_MODE=managed
      - TENANT_ID=tenant1
      - KAFKA_BROKERS=kafka-tenant1:29092
      - KAFKA_TOPIC=bme280-measurements
      - KAFKA_CONSUMER_GROUP=tenant1-ingest-group
      - CASSANDRA_KEYSPACE=mysimbdp_tenant1
      - CASSANDRA_HOSTS=cassandra1,cassandra2,cassandra3

  tenant2-streamingestworker:
    build:
      context: .
      dockerfile: dockerfile
    profiles:
      - workers
    depends_on:
      kafka-tenant2:
        condition: service_healthy
      cassandra1:
        condition: service_healthy
    networks:
      - cassandra_net
    volumes:
      - ./tenant_configs:/app/tenant_configs:ro
    command: ./consumer
    environment:
      - WORKER_MODE=managed
      - TENANT_ID=tenant2
      - KAFKA_BROKERS=kafka-tenant2:29092
      - KAFKA_TOPIC=bme280-measurements
      - KAFKA_CONSUMER_GROUP=tenant2-ingest-group
      - CASSANDRA_KEYSPACE=mysimbdp_tenant2
      - CASSANDRA_HOSTS=cassandra1,cassandra2,cassandra3

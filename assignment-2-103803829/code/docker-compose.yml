x-cassandra-env: &cassandra-env
  CASSANDRA_CLUSTER_NAME: mysimbdp
  CASSANDRA_SEEDS: cassandra1
  CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
  MAX_HEAP_SIZE: 512M
  HEAP_NEWSIZE: 100M

services:
  cassandra1:
    image: cassandra:latest
    hostname: cassandra1
    container_name: cassandra1
    environment:
      <<: *cassandra-env
      CASSANDRA_DC: DC1
    ports:
      - "9042:9042"
    networks:
      - cassandra_net
    volumes:
      - cassandra1_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "SELECT now() FROM system.local;"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  cassandra2:
    image: cassandra:latest
    hostname: cassandra2
    container_name: cassandra2
    environment:
      <<: *cassandra-env
      CASSANDRA_DC: DC1
    depends_on:
      - cassandra1
    networks:
      - cassandra_net
    volumes:
      - cassandra2_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "SELECT now() FROM system.local;"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  cassandra3:
    image: cassandra:latest
    hostname: cassandra3
    container_name: cassandra3
    environment:
      <<: *cassandra-env
      CASSANDRA_DC: DC2
    depends_on:
      - cassandra1
    networks:
      - cassandra_net
    volumes:
      - cassandra3_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "SELECT now() FROM system.local;"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

networks:
  cassandra_net:
    driver: bridge

volumes:
  cassandra1_data:
  cassandra2_data:
  cassandra3_data:
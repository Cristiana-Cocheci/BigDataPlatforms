tenant_id: tenant2

pipeline_constraints:
  compute:
    max_cpu_cores: 4
    max_memory_gb: 8
    max_parallel_jobs: 1

  throughput:
    max_records_per_second: 10000
    max_mb_per_second: 50

  scheduling:
    pipeline_type: batch
    min_batch_interval_sec: 86400
    max_pipeline_runtime_sec: 1

  storage:
    max_silver_storage_gb: 100
    silver_retention_days: 30

  reliability:
    max_retries: 3
    checkpoint_interval_sec: 300

  latency:
    max_processing_delay_sec: 7200

pipeline:
  storage_backend: local
  cache_dir: ./tenant_caching_dir/tenant2

  logging:
    dir: ./logs/silverpipeline/tenant2-bad-runtime
    run_file: run_status.jsonl
    task_file: task_status.jsonl

  extract_page_size: 1000
  extract_day: "2025-06-01"

  gcs:
    bucket: caching-silverpipeline-bucket
    prefix: tenant2/silverpipeline-cache
    credentials_file: ./silverpipelinecmd/css-cristianacocheci-2025-6126fecb6879.json

  batchmanager:
    input_glob: "*_bronze_extract.csv"
    state_file: .batchmanager_state.json

  transformation:
    drop_rows_with_missing_entries: true
    metric_fields:
      - temperature
      - humidity

x-cassandra-env: &cassandra-env
  CASSANDRA_CLUSTER_NAME: mysimbdp
  CASSANDRA_SEEDS: cassandra1
  CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
  MAX_HEAP_SIZE: 512M
  HEAP_NEWSIZE: 100M

services:
  zookeeper-tenant2:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper-tenant2
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - cassandra_net
    ports:
      - "2183:2181"

  kafka-tenant2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-tenant2
    depends_on:
      - zookeeper-tenant2
    ports:
      - "9094:9092"
    environment:
      KAFKA_BROKER_ID: 102
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-tenant2:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-tenant2:29092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DELETE_TOPIC_ENABLE: "true"
    networks:
      - cassandra_net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  kafka-topic-init-tenant2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-topic-init-tenant2
    depends_on:
      kafka-tenant2:
        condition: service_healthy
    networks:
      - cassandra_net
    command:
      - /bin/sh
      - -c
      - |
        kafka-topics --bootstrap-server kafka-tenant2:29092 --create --if-not-exists --topic dht22-measurements --replication-factor 1 --partitions 1
        kafka-topics --bootstrap-server kafka-tenant2:29092 --list

  cassandra1:
    image: cassandra:latest
    hostname: cassandra1
    container_name: cassandra1
    environment:
      <<: *cassandra-env
      CASSANDRA_DC: DC1
    ports:
      - "9042:9042"
    networks:
      - cassandra_net
    volumes:
      - cassandra1_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "SELECT now() FROM system.local;"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  cassandra2:
    image: cassandra:latest
    hostname: cassandra2
    container_name: cassandra2
    environment:
      <<: *cassandra-env
      CASSANDRA_DC: DC1
    depends_on:
      - cassandra1
    networks:
      - cassandra_net
    volumes:
      - cassandra2_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "SELECT now() FROM system.local;"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  cassandra3:
    image: cassandra:latest
    hostname: cassandra3
    container_name: cassandra3
    environment:
      <<: *cassandra-env
      CASSANDRA_DC: DC2
    depends_on:
      - cassandra1
    networks:
      - cassandra_net
    volumes:
      - cassandra3_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "SELECT now() FROM system.local;"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  cassandra-init-tenant2:
    image: cassandra:latest
    container_name: cassandra-init-tenant2
    depends_on:
      cassandra1:
        condition: service_healthy
    networks:
      - cassandra_net
    volumes:
      - ./init_flink_single_tenant.cql:/init_flink_single_tenant.cql:ro
    command:
      - /bin/sh
      - -c
      - |
        cqlsh cassandra1 -f /init_flink_single_tenant.cql

networks:
  cassandra_net:
    driver: bridge

volumes:
  cassandra1_data:
  cassandra2_data:
  cassandra3_data: